<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A project case study by Kyle Zhou." />
    <title>Project | Kyle Zhou</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="project.css" />
  </head>
  <body>
    <main class="case-shell" data-project-page>
      <nav class="case-nav" aria-label="Project navigation">
        <a class="back-home" href="index.html">
          <i data-lucide="arrow-left" aria-hidden="true"></i>
          Kyle Zhou
        </a>
        <button class="icon-link theme-toggle" type="button" aria-label="Toggle dark theme" title="Toggle theme">
          <i data-lucide="moon">mode</i>
        </button>
      </nav>

      <header class="case-hero">
        <p class="case-year" data-project-year></p>
        <h1 data-project-name></h1>
        <p class="case-summary" data-project-summary></p>
        <div class="case-tags" data-project-tags aria-label="Technologies"></div>
      </header>

      <section class="project-demo" data-project-demo hidden></section>

      <article class="case-story" aria-label="Project case study">
        <p><strong>Why I built it.</strong> <span data-project-purpose></span></p>
        <p class="technical-entry"><strong>How I implemented it.</strong> <span data-project-implementation></span></p>
        <p><strong>The hardest part.</strong> <span data-project-challenge></span></p>
        <p><strong>What I learned.</strong> <span data-project-learning></span></p>
      </article>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="project.js"></script>
  </body>
</html>
