<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A project case study by Kyle Zhou." />
    <title>Project | Kyle Zhou</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="project.css" />
  </head>
  <body>
    <main class="case-shell" data-project-page>
      <nav class="case-nav" aria-label="Project navigation">
        <a class="back-home" href="index.html">
          <i data-lucide="arrow-left" aria-hidden="true"></i>
          Kyle Zhou
        </a>
        <button class="icon-link theme-toggle" type="button" aria-label="Toggle dark theme" title="Toggle theme">
          <i data-lucide="moon">mode</i>
        </button>
      </nav>

      <header class="case-hero">
        <p class="case-year" data-project-year></p>
        <h1 data-project-name></h1>
        <p class="case-summary" data-project-summary></p>
        <div class="case-tags" data-project-tags aria-label="Technologies"></div>
        <a class="case-action" href="#demo">
          Try the preview
          <i data-lucide="arrow-down" aria-hidden="true"></i>
        </a>
      </header>

      <section class="case-purpose" aria-labelledby="purpose-title">
        <h2 id="purpose-title">Why I built it</h2>
        <p data-project-purpose></p>
      </section>

      <section class="case-demo-section" id="demo" aria-labelledby="demo-title">
        <div class="case-section-heading">
          <h2 id="demo-title">Quick demo</h2>
          <p>Interactive preview with sample data. Nothing leaves your browser.</p>
        </div>
        <div class="case-demo" data-project-demo></div>
      </section>

      <section class="case-build" aria-labelledby="build-title">
        <h2 id="build-title">How it works</h2>
        <div class="build-flow" data-project-flow></div>
      </section>

      <section class="case-reflection" aria-label="Project reflection">
        <article>
          <h2>Hardest part</h2>
          <p data-project-challenge></p>
        </article>
        <article>
          <h2>What I learned</h2>
          <p data-project-learning></p>
        </article>
      </section>

      <nav class="next-project" aria-label="Next project">
        <span>Next project</span>
        <a data-next-link href="#">
          <strong data-next-name></strong>
          <i data-lucide="arrow-up-right" aria-hidden="true"></i>
        </a>
      </nav>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="project.js"></script>
  </body>
</html>
